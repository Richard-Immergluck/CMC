<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 420" preserveAspectRatio="none">
  <defs>
    <path id="paperShape" d="M15 0 C14 35 16 72 14 108 C12 163 16 214 13 268 C11 321 15 370 13 420 L108 420 C106 373 110 326 108 278 C106 227 111 175 108 126 C105 84 110 42 107 0 Z"/>
    <clipPath id="paperClip">
      <use href="#paperShape"/>
    </clipPath>
    <linearGradient id="paperBase" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#d9c79e"/>
      <stop offset=".28" stop-color="#ead9b7"/>
      <stop offset=".55" stop-color="#e1cca0"/>
      <stop offset=".78" stop-color="#ead8b1"/>
      <stop offset="1" stop-color="#d2b986"/>
    </linearGradient>
    <filter id="edgeWaver" x="-10%" y="-4%" width="120%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency=".035 .18" numOctaves="3" seed="22" result="edgeNoise"/>
      <feDisplacementMap in="SourceGraphic" in2="edgeNoise" scale="1.25" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="paperGrain" x="-8%" y="-4%" width="116%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency=".12 .22" numOctaves="5" seed="41" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="
        .36 0 0 0 .54
        0 .30 0 0 .48
        0 0 .20 0 .36
        0 0 0 .24 0" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
    </filter>
    <filter id="cloudMottle" x="-10%" y="-5%" width="120%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".034 .052" numOctaves="4" seed="68" result="clouds"/>
      <feColorMatrix in="clouds" type="matrix" values="
        .30 0 0 0 .54
        0 .25 0 0 .47
        0 0 .15 0 .34
        0 0 0 .18 0"/>
    </filter>
    <filter id="fineSpeckle" x="-8%" y="-4%" width="116%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="1.18 .82" numOctaves="3" seed="53" result="speckle"/>
      <feColorMatrix in="speckle" type="matrix" values="
        .18 0 0 0 .45
        0 .14 0 0 .37
        0 0 .09 0 .25
        0 0 0 .13 0"/>
    </filter>
    <filter id="softBlur" x="-30%" y="-20%" width="160%" height="140%">
      <feGaussianBlur stdDeviation="4.25"/>
    </filter>
  </defs>
  <use href="#paperShape" fill="url(#paperBase)" filter="url(#edgeWaver)"/>
  <use href="#paperShape" fill="url(#paperBase)" filter="url(#paperGrain)" opacity=".9"/>
  <g clip-path="url(#paperClip)">
    <rect x="8" y="-4" width="104" height="428" fill="#7b5b32" opacity=".11" filter="url(#cloudMottle)"/>
    <rect x="10" y="0" width="100" height="420" fill="#f8ebc9" opacity=".15" filter="url(#fineSpeckle)"/>
    <g filter="url(#softBlur)">
      <ellipse cx="30" cy="42" rx="24" ry="30" fill="#7e5a2e" opacity=".055"/>
      <ellipse cx="79" cy="68" rx="29" ry="38" fill="#fff0c7" opacity=".09"/>
      <ellipse cx="46" cy="115" rx="35" ry="43" fill="#8f6a37" opacity=".045"/>
      <ellipse cx="92" cy="154" rx="25" ry="36" fill="#f6e5be" opacity=".08"/>
      <ellipse cx="30" cy="192" rx="27" ry="45" fill="#76542d" opacity=".05"/>
      <ellipse cx="73" cy="235" rx="36" ry="48" fill="#f9eac6" opacity=".075"/>
      <ellipse cx="39" cy="282" rx="31" ry="42" fill="#8a6333" opacity=".048"/>
      <ellipse cx="90" cy="326" rx="27" ry="41" fill="#f3dfb4" opacity=".072"/>
      <ellipse cx="54" cy="372" rx="38" ry="42" fill="#76542d" opacity=".04"/>
    </g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M27 34 C38 29 49 38 61 32 C72 27 82 34 94 30" stroke="#7f6139" stroke-opacity=".055" stroke-width=".75"/>
      <path d="M24 88 C36 80 49 91 63 84 C76 78 87 88 100 82" stroke="#6d5130" stroke-opacity=".045" stroke-width=".65"/>
      <path d="M35 148 C46 140 58 153 71 145 C82 139 91 148 99 143" stroke="#8f6a3c" stroke-opacity=".048" stroke-width=".65"/>
      <path d="M21 217 C35 207 49 221 65 212 C78 206 88 218 101 210" stroke="#6c5030" stroke-opacity=".043" stroke-width=".6"/>
      <path d="M34 297 C45 288 59 302 72 294 C84 288 92 297 100 292" stroke="#87623a" stroke-opacity=".045" stroke-width=".6"/>
      <path d="M25 365 C37 356 52 370 66 362 C79 355 89 366 98 360" stroke="#6d5130" stroke-opacity=".04" stroke-width=".58"/>
    </g>
    <g fill="#5d4328" opacity=".09">
      <circle cx="29" cy="52" r=".52"/>
      <circle cx="73" cy="71" r=".42"/>
      <circle cx="49" cy="128" r=".48"/>
      <circle cx="94" cy="187" r=".38"/>
      <circle cx="37" cy="226" r=".44"/>
      <circle cx="78" cy="304" r=".38"/>
      <circle cx="55" cy="369" r=".44"/>
      <ellipse cx="42" cy="63" rx="1.2" ry=".52" transform="rotate(-18 42 63)"/>
      <ellipse cx="89" cy="116" rx=".95" ry=".48" transform="rotate(24 89 116)"/>
      <ellipse cx="31" cy="158" rx="1.05" ry=".5" transform="rotate(-8 31 158)"/>
      <ellipse cx="72" cy="217" rx="1.05" ry=".5" transform="rotate(19 72 217)"/>
      <ellipse cx="46" cy="286" rx=".95" ry=".48" transform="rotate(-23 46 286)"/>
      <ellipse cx="92" cy="343" rx="1.08" ry=".5" transform="rotate(12 92 343)"/>
    </g>
  </g>
</svg>
