name: CMC CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://prisma:prisma@localhost:5432/prisma?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-nextauth-secret
      GOOGLE_CLIENT_ID: ci-placeholder
      GOOGLE_CLIENT_SECRET: ci-placeholder
      S3_ACCESS_ID: ci-placeholder
      S3_APP_ACCESS_KEY: ci-placeholder
      S3_BUCKET_NAME: ci-placeholder
      S3_REGION: eu-west-2
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
      ALLOW_SIMULATED_PURCHASES: 'false'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: prisma
          POSTGRES_PASSWORD: prisma
          POSTGRES_DB: prisma
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browser
        run: yarn test:e2e:install

      - name: Generate Prisma client
        run: yarn prisma generate

      - name: Apply database migrations
        run: yarn prisma migrate deploy

      - name: RLS and grant posture
        run: yarn security:rls

      - name: Database integration tests
        run: yarn test:integration
        env:
          CMC_RUN_INTEGRATION_TESTS: 'true'

      - name: Sanity checks
        run: yarn sanity

      - name: Dependency audit
        run: yarn deps:audit

      - name: Deployment readiness
        run: yarn deploy:check
        env:
          VERCEL_PROJECT_ROOT: .
          VERCEL_NODE_VERSION: 24.x
          SUPABASE_PROJECT_STATUS: ACTIVE

      - name: Smoke test syntax
        run: node --check scripts/smoke-test.js

      - name: Unit tests
        run: yarn test:unit

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Route manifest checks
        run: yarn routes:check

      - name: Seed browser smoke data
        run: yarn seed:e2e

      - name: Browser smoke tests
        run: yarn test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
