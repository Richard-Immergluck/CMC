    <text x="132" y="308" class="body">Search, download and manage the tracks you own. Uploader and admin tools appear only when your role allows them.</text>

    <rect x="1040" y="148" width="340" height="164" class="soft"/>
    <text x="1072" y="194" class="h2">Richard I<span class="gold">.</span></text>
    <text x="1072" y="224" class="small">Member since 2026 · customer</text>
    <rect x="1072" y="252" width="130" height="38" class="button"/><rect x="1072" y="252" width="8" height="38" class="gold"/><text x="1109" y="276" class="buttonText">Edit profile</text>
    <rect x="1218" y="252" width="130" height="38" class="buttonLight"/><rect x="1218" y="252" width="8" height="38" class="gold"/><text x="1245" y="276" class="buttonTextDark">Account</text>

