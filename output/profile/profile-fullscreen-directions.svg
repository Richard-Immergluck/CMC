      <rect x="930" y="42" width="146" height="34" class="cream"/><text x="952" y="64" class="small">Key: All</text>
      <rect x="1090" y="42" width="146" height="34" class="cream"/><text x="1112" y="64" class="small">Composer: All</text>
      <rect x="1250" y="42" width="38" height="34" class="buttonLight"/><text x="1262" y="64" class="buttonTextDark">X</text>

