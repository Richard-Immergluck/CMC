    <rect x="0" y="28" width="1460" height="900" rx="0" class="screen" filter="url(#shadow)"/>
    <rect x="0" y="28" width="1460" height="74" fill="#fbf8ef" stroke="#d7cbb8"/>
    <use href="#logo" x="30" y="36" width="190" height="58"/>
    <text x="880" y="75" class="body">Catalogue</text>
    <text x="972" y="75" class="body">Requests</text>
    <text x="1070" y="75" class="body">Community</text>
    <text x="1182" y="75" class="body">Cart</text>
    <circle cx="1392" cy="64" r="23" class="green"/><text x="1380" y="72" class="sans" font-size="15" font-weight="700" fill="#fff">RI</text>

    <rect x="36" y="136" width="58" height="210" fill="url(#bar)" opacity="0.86"/>
    <g transform="translate(36 146)">
      <line x1="0" y1="18" x2="360" y2="18" class="staff"/><line x1="0" y1="30" x2="360" y2="30" class="staff"/><line x1="0" y1="42" x2="360" y2="42" class="staff"/><line x1="0" y1="54" x2="360" y2="54" class="staff"/><line x1="0" y1="66" x2="360" y2="66" class="staff"/>
    </g>
    <text x="132" y="190" class="label">YOUR MUSIC</text>
