      <line x1="28" y1="172" x2="1284" y2="172" class="line"/>
      <text x="28" y="212" class="body">Piano Concerto No. 21 - II. Andante</text><text x="420" y="212" class="body">W. A. Mozart</text><text x="610" y="212" class="body">C major</text><text x="740" y="212" class="body">Clare R.</text><text x="900" y="212" class="body">4 Jul 2026</text>
      <rect x="1080" y="190" width="116" height="36" class="button"/><rect x="1080" y="190" width="8" height="36" class="gold"/><text x="1110" y="213" class="buttonText">Download</text>
      <rect x="1210" y="190" width="74" height="36" class="buttonLight"/><rect x="1210" y="190" width="8" height="36" class="gold"/><text x="1236" y="213" class="buttonTextDark">Open</text>
      <line x1="28" y1="246" x2="1284" y2="246" class="line"/>
      <text x="28" y="286" class="body">Cello Sonata No. 1 - I. Allegro</text><text x="420" y="286" class="body">J. Brahms</text><text x="610" y="286" class="body">E minor</text><text x="740" y="286" class="body">P. Lang</text><text x="900" y="286" class="body">2 Jul 2026</text>
      <rect x="1080" y="264" width="116" height="36" class="button"/><rect x="1080" y="264" width="8" height="36" class="gold"/><text x="1110" y="287" class="buttonText">Download</text>
      <rect x="1210" y="264" width="74" height="36" class="buttonLight"/><rect x="1210" y="264" width="8" height="36" class="gold"/><text x="1236" y="287" class="buttonTextDark">Open</text>
      <line x1="28" y1="320" x2="1284" y2="320" class="line"/>
      <text x="28" y="360" class="body">Violin Concerto in G - II. Adagio</text><text x="420" y="360" class="body">M. Bruch</text><text x="610" y="360" class="body">G major</text><text x="740" y="360" class="body">M. De Luca</text><text x="900" y="360" class="body">29 Jun 2026</text>
      <rect x="1080" y="338" width="116" height="36" class="button"/><rect x="1080" y="338" width="8" height="36" class="gold"/><text x="1110" y="361" class="buttonText">Download</text>
      <rect x="1210" y="338" width="74" height="36" class="buttonLight"/><rect x="1210" y="338" width="8" height="36" class="gold"/><text x="1236" y="361" class="buttonTextDark">Open</text>
