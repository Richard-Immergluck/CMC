      <text x="0" y="96" class="body">This direction treats the profile as a role-aware command centre. Member library remains first-class; uploader and admin panels are additive.</text>
      <rect x="0" y="134" width="248" height="96" class="soft"/><text x="28" y="176" class="h2">18</text><text x="28" y="205" class="small">Purchased downloads</text>
      <rect x="272" y="134" width="248" height="96" class="soft"/><text x="300" y="176" class="h2">48</text><text x="300" y="205" class="small">Published uploads</text>
      <rect x="544" y="134" width="248" height="96" class="soft"/><text x="572" y="176" class="h2">£3,060</text><text x="572" y="205" class="small">Gross marketplace sales</text>
      <rect x="816" y="134" width="248" height="96" class="soft"/><text x="844" y="176" class="h2">5</text><text x="844" y="205" class="small">Pending actions</text>

      <rect x="0" y="274" width="646" height="414" class="soft"/>
      <text x="28" y="316" class="label">DOWNLOAD LIBRARY</text>
      <rect x="28" y="342" width="590" height="44" class="cream"/><text x="48" y="370" class="small">Search owned tracks...</text>
      <line x1="28" y1="418" x2="618" y2="418" class="line"/>
      <text x="28" y="452" class="body">Mozart - Piano Concerto No. 21</text><text x="472" y="452" class="body">Download</text>
      <line x1="28" y1="486" x2="618" y2="486" class="line"/>
      <text x="28" y="520" class="body">Brahms - Cello Sonata No. 1</text><text x="472" y="520" class="body">Download</text>
      <line x1="28" y1="554" x2="618" y2="554" class="line"/>
      <text x="28" y="588" class="body">Bruch - Violin Concerto in G</text><text x="472" y="588" class="body">Download</text>

      <rect x="678" y="274" width="386" height="194" class="soft"/>
      <rect x="678" y="274" width="8" height="194" class="gold"/>
      <text x="708" y="316" class="label">UPLOADER TOOLS</text>
      <text x="708" y="352" class="body">Track review state, upload performance, request matches and public profile preview.</text>
      <rect x="708" y="398" width="132" height="38" class="button"/><rect x="708" y="398" width="8" height="38" class="gold"/><text x="744" y="422" class="buttonText">Manage</text>
      <rect x="678" y="494" width="386" height="194" class="soft"/>
      <rect x="678" y="494" width="8" height="194" fill="#aeb9b3"/>
      <text x="708" y="536" class="label">ADMIN / SUPPORT</text>
      <text x="708" y="572" class="body">Only appears for elevated roles: pending reviews, security dashboard and support-safe shortcuts.</text>
      <rect x="708" y="618" width="132" height="38" class="buttonLight"/><rect x="708" y="618" width="8" height="38" class="gold"/><text x="734" y="642" class="buttonTextDark">Open admin</text>
