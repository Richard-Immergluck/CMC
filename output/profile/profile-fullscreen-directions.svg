<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3180" viewBox="0 0 1600 3180">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ed"/>
      <stop offset="0.55" stop-color="#f6efe1"/>
      <stop offset="1" stop-color="#ead9bd"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d4a8"/>
      <stop offset="0.48" stop-color="#dfb273"/>
      <stop offset="1" stop-color="#c89142"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#271f17" flood-opacity="0.12"/>
    </filter>
    <style>
      .screen { fill: url(#paper); stroke: #d4c8b5; stroke-width: 1.2; }
      .panel { fill: rgba(255,255,255,0.42); stroke: #d7cbb8; stroke-width: 1.2; }
      .soft { fill: #fbf8ef; stroke: #d7cbb8; stroke-width: 1.2; }
      .cream { fill: #f1e4cd; stroke: #d7cbb8; stroke-width: 1.1; }
      .green { fill: #064846; }
      .red { fill: #8e3438; }
      .gold { fill: #bd8318; }
      .ink { fill: #172027; }
      .muted { fill: #625b50; }
      .line { stroke: #d1c5b2; stroke-width: 1.1; }
      .staff { stroke: #526062; stroke-width: 1; opacity: 0.76; }
      .goldStroke { stroke: #bd8318; stroke-width: 4; }
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2.6px; fill: #8e3438; }
      .smallcap { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 4px; fill: #172027; }
      .h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 56px; letter-spacing: 0; fill: #172027; }
      .h2 { font-family: Georgia, 'Times New Roman', serif; font-size: 34px; letter-spacing: 0; fill: #172027; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #172027; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #625b50; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 11px; fill: #625b50; }
      .button { fill: #064846; stroke: #073b3a; stroke-width: 1.2; }
      .buttonLight { fill: #fbf8ef; stroke: #aeb9b3; stroke-width: 1.4; }
      .buttonText { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #fff; }
      .buttonTextDark { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 700; fill: #064846; }
      .tabActive { fill: #064846; }
      .tableHead { font-family: Arial, Helvetica, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #8e3438; }
    </style>
  </defs>

  <rect width="1600" height="3180" fill="#eee2cf"/>
  <text x="70" y="70" class="smallcap">CMC PROFILE PAGE - FULL SCREEN PRODUCT DIRECTIONS</text>
  <text x="70" y="102" class="small muted">All three assume uploaders inherit the standard member library/search/download tools, then gain upload, performance and public-profile surfaces.</text>

  <!-- Shared logo symbol -->
  <symbol id="logo" viewBox="0 0 190 58">
    <g transform="translate(0 12)">
      <line x1="0" y1="4" x2="96" y2="4" class="staff"/>
      <line x1="0" y1="12" x2="96" y2="12" class="staff"/>
      <line x1="0" y1="20" x2="96" y2="20" class="staff"/>
      <line x1="0" y1="28" x2="96" y2="28" class="staff"/>
      <line x1="0" y1="36" x2="96" y2="36" class="staff"/>
      <rect x="43" y="-5" width="18" height="52" fill="url(#bar)" opacity="0.88"/>
    </g>
    <text x="116" y="43" class="serif ink" font-size="38">CMC</text>
  </symbol>

  <!-- VERSION 1 -->
  <g transform="translate(70 140)">
