<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="D  ARCHIVE SLIP / APPROVAL SEALS">
  <defs>
    <filter id="paperNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="23" />
      <feColorMatrix type="saturate" values="0.2" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.14" />
      </feComponentTransfer>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2a2012" flood-opacity="0.12" />
    </filter>
    <linearGradient id="parchment" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#efd5ad" />
      <stop offset="0.5" stop-color="#f5dfbd" />
      <stop offset="1" stop-color="#d4a057" />
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0" stop-color="#073f42" />
      <stop offset="1" stop-color="#0b626b" />
    </linearGradient>
    <style>
      .bg { fill: #f8f3e9; }
      .grain { filter: url(#paperNoise); opacity: 0.65; }
      .label { fill: #94383d; font: 800 13px Arial, sans-serif; letter-spacing: 4px; }
      .tiny { fill: #665f52; font: 760 10px Arial, sans-serif; letter-spacing: 2px; }
      .small { fill: #665f52; font: 650 13px Arial, sans-serif; }
      .serif { fill: #182025; font-family: Georgia, 'Times New Roman', serif; }
      .fine { stroke: #5f6c69; stroke-width: 0.8; opacity: 0.22; }
      .sep { stroke: #bb811a; stroke-width: 2.5; }
      .card { fill: rgba(255,251,243,0.62); stroke: rgba(24,32,37,0.14); stroke-width: 1; }
    </style>
  </defs>
  <rect class="bg" width="760" height="520" />
  <rect class="grain" width="760" height="520" />
  <rect x="32" y="36" width="696" height="448" fill="none" stroke="rgba(24,32,37,0.14)" />
  
    <text x="64" y="78" class="label">D  ARCHIVE SLIP / APPROVAL SEALS</text>
    <text x="64" y="104" class="small">A reduced approval record for upload review.</text>
    <rect x="150" y="130" width="430" height="286" class="card" filter="url(#softShadow)" />
    <rect x="112" y="104" width="68" height="344" fill="url(#parchment)" />
    <rect x="112" y="104" width="68" height="344" class="grain" />
    <line x1="210" x2="532" y1="210" y2="210" class="fine" />
    <line x1="210" x2="532" y1="296" y2="296" class="fine" />
    <line x1="210" x2="532" y1="382" y2="382" class="fine" />
    
    
  <g transform="translate(146 188)">
    <circle r="16" fill="none" stroke="#bb811a" stroke-width="2" />
    <circle r="10" fill="#bb811a" opacity="0.16" />
    <text y="4" text-anchor="middle" style="fill:#bb811a; font:800 8px Arial, sans-serif; letter-spacing:1px;">IN</text>
  </g>
    
  <g transform="translate(146 274)">
    <circle r="16" fill="none" stroke="#94383d" stroke-width="2" />
    <circle r="10" fill="#94383d" opacity="0.16" />
    <text y="4" text-anchor="middle" style="fill:#94383d; font:800 8px Arial, sans-serif; letter-spacing:1px;">RV</text>
  </g>
    
  <g transform="translate(146 360)">
    <circle r="16" fill="none" stroke="#0b626b" stroke-width="2" />
    <circle r="10" fill="#0b626b" opacity="0.16" />
    <text y="4" text-anchor="middle" style="fill:#0b626b; font:800 8px Arial, sans-serif; letter-spacing:1px;">OK</text>
  </g>
  
    
    <text x="220" y="200" class="serif" style="font-size:30px">Submitted</text>
    <text x="220" y="286" class="serif" style="font-size:30px">Reviewed</text>
    <text x="220" y="372" class="serif" style="font-size:30px">Published</text>
    <path d="M402 178 C 450 194, 482 184, 524 202" fill="none" stroke="#bb811a" stroke-width="2.4" />
    <path d="M402 264 C 450 280, 482 270, 524 288" fill="none" stroke="#94383d" stroke-width="2.4" />
    <path d="M402 350 C 450 366, 482 356, 524 374" fill="none" stroke="#0b626b" stroke-width="2.4" />
    <text x="220" y="430" class="small">A simple record of the approval path.</text>
  
  
</svg>