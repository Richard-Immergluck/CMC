<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="A  PROGRESSIVE DOTS">
  <defs>
    <filter id="paperNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="4" seed="42" />
      <feColorMatrix type="saturate" values="0.14" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.14" />
      </feComponentTransfer>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="11" stdDeviation="15" flood-color="#2a2012" flood-opacity="0.10" />
    </filter>
    <linearGradient id="parchment" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#efd5ad" />
      <stop offset="0.58" stop-color="#f3d8ad" />
      <stop offset="1" stop-color="#d19a43" />
    </linearGradient>
    <style>
      .bg { fill: #f8f3e9; }
      .grain { filter: url(#paperNoise); opacity: 0.72; }
      .outer { fill: none; stroke: rgba(24,32,37,0.15); stroke-width: 1; }
      .card { fill: rgba(255,250,240,0.64); stroke: rgba(24,32,37,0.15); stroke-width: 1; }
      .serif { fill: #182025; font-family: Georgia, 'Times New Roman', serif; font-size: 40px; }
      .label { fill: #94383d; font: 800 13px Arial, sans-serif; letter-spacing: 4px; }
      .number { fill: #665f52; font: 800 11px Arial, sans-serif; letter-spacing: 2.2px; }
      .rule { stroke: #596765; stroke-width: 0.9; opacity: 0.22; }
    </style>
  </defs>
  <rect class="bg" width="760" height="520" />
  <rect class="grain" width="760" height="520" />
  <rect x="32" y="36" width="696" height="448" class="outer" />
  <rect x="166" y="100" width="440" height="320" class="card" filter="url(#softShadow)" />
  <rect x="118" y="74" width="74" height="372" fill="url(#parchment)" />
  <rect x="118" y="74" width="74" height="372" class="grain" />
  <text x="226" y="152" class="number">01</text>
  <text x="280" y="158" class="serif">Upload</text>
  <text x="226" y="260" class="number">02</text>
  <text x="280" y="266" class="serif">Review</text>
  <text x="226" y="368" class="number">03</text>
  <text x="280" y="374" class="serif">Publish</text>
  <line x1="222" x2="552" y1="202" y2="202" class="rule" />
  <line x1="222" x2="552" y1="310" y2="310" class="rule" />
  
  <g transform="translate(155 145)" stroke="#bb811a" fill="none">
    <line x1="-34" x2="34" y1="-18" y2="-18" stroke-width="1.2" opacity="0.68" /><line x1="-34" x2="34" y1="-9" y2="-9" stroke-width="1.2" opacity="0.68" /><line x1="-34" x2="34" y1="0" y2="0" stroke-width="1.2" opacity="0.68" /><line x1="-34" x2="34" y1="9" y2="9" stroke-width="1.2" opacity="0.68" /><line x1="-34" x2="34" y1="18" y2="18" stroke-width="1.2" opacity="0.68" />
    <circle cx="-21" cy="-9" r="3.8" fill="#bb811a" stroke="none" opacity="1" /><circle cx="0" cy="0" r="2.2" fill="#bb811a" stroke="none" opacity="0.62" /><circle cx="21" cy="9" r="2.2" fill="#bb811a" stroke="none" opacity="0.62" />
    <line x1="-1" x2="-1" y1="-29" y2="28" stroke-width="1.4" opacity="0.45" />
