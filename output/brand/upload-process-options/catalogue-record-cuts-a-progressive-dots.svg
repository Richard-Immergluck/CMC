    <circle cx="-21" cy="-9" r="2.2" fill="#94383d" stroke="none" opacity="0.62" /><circle cx="0" cy="0" r="3.8" fill="#94383d" stroke="none" opacity="1" /><circle cx="21" cy="9" r="2.2" fill="#94383d" stroke="none" opacity="0.62" />
    <line x1="-1" x2="-1" y1="-29" y2="28" stroke-width="1.4" opacity="0.45" />
