      <stop offset="0.58" stop-color="#f3d8ad" />
      <stop offset="1" stop-color="#d19a43" />
    </linearGradient>
    <style>
      .bg { fill: #f8f3e9; }
      .grain { filter: url(#paperNoise); opacity: 0.72; }
      .outer { fill: none; stroke: rgba(24,32,37,0.15); stroke-width: 1; }
      .card { fill: rgba(255,250,240,0.64); stroke: rgba(24,32,37,0.15); stroke-width: 1; }
      .serif { fill: #182025; font-family: Georgia, 'Times New Roman', serif; font-size: 40px; }
      .number { fill: #665f52; font: 800 11px Arial, sans-serif; letter-spacing: 2.2px; }
      .rule { stroke: #596765; stroke-width: 0.9; opacity: 0.2; }
      .mark { filter: url(#inkBleed); }
    </style>
