<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-label="02 STAFF-LINE JOURNEY">
  <defs>
    <filter id="paperNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="18" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12" />
      </feComponentTransfer>
    </filter>
    <filter id="inkNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" seed="7" />
      <feColorMatrix type="saturate" values="0.35" />
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0.08 0.25" />
      </feComponentTransfer>
    </filter>
    <linearGradient id="parchmentGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#efd5ad" />
      <stop offset="0.55" stop-color="#f5ddba" />
      <stop offset="1" stop-color="#d6a75c" />
    </linearGradient>
    <linearGradient id="tealGradient" x1="0" x2="1">
      <stop offset="0" stop-color="#073f42" />
      <stop offset="1" stop-color="#0b626b" />
    </linearGradient>
    <style>
      .bg { fill: #f8f3e9; }
      .texture { filter: url(#paperNoise); opacity: 0.55; }
      .label { fill: #94383d; font: 800 15px Arial, sans-serif; letter-spacing: 5px; }
      .serif { fill: #182025; font-family: Georgia, 'Times New Roman', serif; }
      .sans { font-family: Arial, sans-serif; }
      .small { fill: #665f52; font: 600 14px Arial, sans-serif; }
      .tiny { fill: #665f52; font: 700 11px Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; }
      .line { stroke: #5f6c69; stroke-width: 1.25; opacity: 0.6; }
      .fine { stroke: #5f6c69; stroke-width: 0.75; opacity: 0.38; }
      .gold-line { stroke: #bb811a; stroke-width: 2.5; }
      .red-line { stroke: #94383d; stroke-width: 2; }
      .teal-fill { fill: url(#tealGradient); }
      .gold-fill { fill: #bb811a; }
      .red-fill { fill: #94383d; }
      .grey-fill { fill: #a4aaa5; }
      .paper-stroke { stroke: rgba(24,32,37,0.16); stroke-width: 1; fill: rgba(255,253,248,0.55); }
    </style>
  </defs>
  <rect class="bg" width="760" height="520" />
  <rect class="texture" width="760" height="520" />
  <rect x="20" y="20" width="720" height="480" fill="none" stroke="rgba(24,32,37,0.16)" />
  <text x="42" y="58" class="label">02 STAFF-LINE JOURNEY</text>
  <text x="42" y="84" class="small">A musical path from submission to publication.</text>
  
    <rect x="64" y="132" width="632" height="230" fill="rgba(255,253,248,0.36)" stroke="rgba(24,32,37,0.12)" />
    <line x1="88" x2="672" y1="200" y2="200" class="line" />
<line x1="88" x2="672" y1="214" y2="214" class="line" />
<line x1="88" x2="672" y1="228" y2="228" class="line" />
<line x1="88" x2="672" y1="242" y2="242" class="line" />
<line x1="88" x2="672" y1="256" y2="256" class="line" />
    <rect x="310" y="144" width="54" height="258" fill="url(#parchmentGradient)" opacity="0.82" />
    <rect x="310" y="144" width="54" height="258" filter="url(#paperNoise)" />
    <path d="M122 270 C 234 226, 318 322, 432 270 S 574 225, 638 270" fill="none" stroke="#bb811a" stroke-width="3" />
    <circle cx="122" cy="270" r="20" fill="#bb811a" />
    <circle cx="380" cy="270" r="20" fill="#94383d" />
    <circle cx="638" cy="270" r="20" fill="#0b626b" />
    <circle cx="122" cy="270" r="8" fill="#f8f3e9" />
    <circle cx="380" cy="270" r="8" fill="#f8f3e9" />
    <circle cx="638" cy="270" r="8" fill="#f8f3e9" />
    <text x="84" y="342" class="tiny">SUBMITTED</text>
    <text x="327" y="342" class="tiny">CHECKED</text>
    <text x="588" y="342" class="tiny">PUBLISHED</text>
    <text x="96" y="388" class="serif" style="font-size:24px">File arrives</text>
    <text x="314" y="388" class="serif" style="font-size:24px">Review mark</text>
    <text x="570" y="388" class="serif" style="font-size:24px">Live row</text>
    <line x1="84" x2="676" y1="430" y2="430" class="fine" />
    <circle cx="380" cy="430" r="5" class="gold-fill" />
  
</svg>